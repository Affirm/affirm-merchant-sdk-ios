name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-26
    steps:
    - name: Checkout project
      uses: actions/checkout@v2

    - name: Select available iOS simulator
      run: echo "IOS_DESTINATION=$(python3 tools/buildkite/select-ios-simulator.py)" >> "$GITHUB_ENV"

    - name: Build
      run: xcodebuild build-for-testing -project AffirmSDK.xcodeproj -scheme AffirmSDK -destination "$IOS_DESTINATION"
      
    - name: Test
      run: xcodebuild clean test -project AffirmSDK.xcodeproj -scheme AffirmSDK -destination "$IOS_DESTINATION"
